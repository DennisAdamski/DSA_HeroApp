name: Flutter CI

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'task/**'
  pull_request:
    branches:
      - main

jobs:
  analyze:
    name: Statische Analyse & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Abhaengigkeiten installieren
        run: flutter pub get

      - name: Formatierung pruefen
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Statische Analyse ausfuehren
        run: flutter analyze

  test:
    name: Unit- & Widget-Tests
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Abhaengigkeiten installieren
        run: flutter pub get

      - name: Tests ausfuehren
        run: flutter test

  loc-budget:
    name: LOC-Budget-Pruefung (Screens ≤ 700 Zeilen)
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: LOC-Budget pruefen
        run: python tool/check_screen_loc_budget.py --max-lines 700

  android-build:
    name: Android-Build (Debug-APK)
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      # Gradle laeuft auf diesem JDK; der Bytecode-Zielwert bleibt davon
      # unberuehrt und steht weiterhin auf 17 (android/app/build.gradle.kts).
      # 21 spiegelt die JBR wider, die Android Studio lokal mitbringt.
      - name: JDK einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Abhaengigkeiten installieren
        run: flutter pub get

      # Der einzige Job, der Gradle, AGP und KGP ueberhaupt anfasst. Ohne ihn
      # sind Bumps an android/settings.gradle.kts und gradle-wrapper.properties
      # durch nichts abgesichert — analyze und test bauen kein Android.
      # Release signiert mit Debug-Keys, der Debug-Build braucht keine Secrets.
      - name: Debug-APK bauen
        run: flutter build apk --debug
