name: Flutter CI

on:
  push:
    branches:
      - main
      - test
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - test
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

  workflow_call:
    inputs:
      ref:
        description: Exakter Commit des automatisch synchronisierten Teststands
        required: true
        type: string
      branch:
        description: Zielbranch der wiederverwendeten CI
        required: true
        type: string
    secrets:
      FIREBASE_SERVICE_ACCOUNT_HELDENSYNC_CCF0B:
        required: true

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || inputs.branch || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  feedback-backend:
    name: Feedback-Backend
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Java 21 für Firestore-Emulator einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Backend installieren, testen und bauen
        working-directory: functions
        run: |
          npm ci
          npm test
          npm run build
          npm run test:rules

  analyze:
    name: Statische Analyse & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Abhaengigkeiten installieren
        run: flutter pub get

      - name: Formatierung pruefen
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Statische Analyse ausfuehren
        run: flutter analyze

  test-shard:
    name: Test-Shard ${{ matrix.shard.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - index: 0
            label: '1/4'
          - index: 1
            label: '2/4'
          - index: 2
            label: '3/4'
          - index: 3
            label: '4/4'

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Abhaengigkeiten installieren
        run: flutter pub get

      - name: Tests ausfuehren
        run: |
          mkdir -p reports
          flutter test --no-pub \
            --total-shards 4 \
            --shard-index ${{ matrix.shard.index }} \
            --file-reporter "json:reports/flutter-tests-${{ matrix.shard.index }}.json"

      - name: Laufzeit zusammenfassen
        if: always()
        run: |
          report="reports/flutter-tests-${{ matrix.shard.index }}.json"
          if [ -f "$report" ]; then
            python tool/summarize_flutter_tests.py \
              "$report" \
              --shard "${{ matrix.shard.label }}"
          fi

      - name: Testreport hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-tests-${{ matrix.shard.index }}
          path: reports/flutter-tests-${{ matrix.shard.index }}.json
          if-no-files-found: warn
          retention-days: 3

  test:
    name: Unit- & Widget-Tests
    if: always()
    needs: test-shard
    runs-on: ubuntu-latest

    steps:
      - name: Alle Test-Shards bestaetigen
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: test "$SHARD_RESULT" = "success"

  loc-budget:
    name: LOC-Budget-Pruefung (Screens ≤ 700 Zeilen)
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Main-Test-Sync testen
        run: python tool/test_main_test_sync.py

      - name: Testwerkzeuge und Regeltest-Inventur pruefen
        run: |
          python -m unittest \
            tool/test_flutter_ci_structure.py \
            tool/test_rule_test_evidence.py \
            tool/test_summarize_flutter_tests.py
          python tool/check_rule_test_evidence.py

      - name: LOC-Budget pruefen
        run: python tool/check_screen_loc_budget.py --max-lines 700

  web-build:
    name: Web-Release-Build
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      # Commit und Bauzeit erscheinen in der App unter Einstellungen.
      - name: Web-Release bauen
        env:
          BUILD_COMMIT: ${{ inputs.ref || github.sha }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          FEEDBACK_API_URL: ${{ (inputs.branch || github.ref_name) == 'test' && 'https://europe-west10-heldensync-ccf0b.cloudfunctions.net/feedbackApiTest' || (inputs.branch || github.ref_name) == 'main' && 'https://europe-west10-heldensync-ccf0b.cloudfunctions.net/feedbackApi' || '' }}
          # Zugang zur Regel-Wissensbasis (SPIEL-04); leer heißt: kein Cloud-Weg.
          RULES_INDEX_API_URL: ${{ (inputs.branch || github.ref_name) == 'test' && 'https://europe-west10-heldensync-ccf0b.cloudfunctions.net/rulesIndexApiTest' || (inputs.branch || github.ref_name) == 'main' && 'https://europe-west10-heldensync-ccf0b.cloudfunctions.net/rulesIndexApi' || '' }}
          FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.FIREBASE_APP_CHECK_SITE_KEY }}
          LEGAL_RESPONSIBLE_NAME: ${{ vars.LEGAL_RESPONSIBLE_NAME }}
          LEGAL_STREET_ADDRESS: ${{ vars.LEGAL_STREET_ADDRESS }}
          LEGAL_POSTAL_CODE: ${{ vars.LEGAL_POSTAL_CODE }}
          LEGAL_CITY: ${{ vars.LEGAL_CITY }}
          LEGAL_COUNTRY: ${{ vars.LEGAL_COUNTRY }}
          LEGAL_CONTACT_EMAIL: ${{ vars.LEGAL_CONTACT_EMAIL }}
        run: |
          test -n "$FIREBASE_APP_CHECK_SITE_KEY"
          test -n "$LEGAL_RESPONSIBLE_NAME"
          test -n "$LEGAL_STREET_ADDRESS"
          test -n "$LEGAL_POSTAL_CODE"
          test -n "$LEGAL_CITY"
          test -n "$LEGAL_COUNTRY"
          test -n "$LEGAL_CONTACT_EMAIL"
          flutter build web --release \
            --no-web-resources-cdn \
            --dart-define=BUILD_COMMIT="$BUILD_COMMIT" \
            --dart-define=BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --dart-define=FEEDBACK_API_URL="$FEEDBACK_API_URL" \
            --dart-define=RULES_INDEX_API_URL="$RULES_INDEX_API_URL" \
            --dart-define=FIREBASE_APP_CHECK_SITE_KEY="$FIREBASE_APP_CHECK_SITE_KEY" \
            --dart-define=LEGAL_RESPONSIBLE_NAME="$LEGAL_RESPONSIBLE_NAME" \
            --dart-define=LEGAL_STREET_ADDRESS="$LEGAL_STREET_ADDRESS" \
            --dart-define=LEGAL_POSTAL_CODE="$LEGAL_POSTAL_CODE" \
            --dart-define=LEGAL_CITY="$LEGAL_CITY" \
            --dart-define=LEGAL_COUNTRY="$LEGAL_COUNTRY" \
            --dart-define=LEGAL_CONTACT_EMAIL="$LEGAL_CONTACT_EMAIL"
      - name: Build verifizieren
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
          FEEDBACK_API_URL: ${{ (inputs.branch || github.ref_name) == 'test' && 'https://europe-west10-heldensync-ccf0b.cloudfunctions.net/feedbackApiTest' || (inputs.branch || github.ref_name) == 'main' && 'https://europe-west10-heldensync-ccf0b.cloudfunctions.net/feedbackApi' || '' }}
        run: |
          test -f build/web/assets/AssetManifest.bin.json
          test -n "$(ls -A build/web/assets/assets/heroes 2>/dev/null)"
          if [ "$BRANCH" = "test" ] || [ "$BRANCH" = "main" ]; then
            grep -Fq "$FEEDBACK_API_URL" build/web/main.dart.js
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: web-release
          path: build/web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Firebase Hosting veröffentlichen
    if: github.event_name == 'push' && (inputs.branch == '' || inputs.branch == 'test')
    needs: [feedback-backend, analyze, test, loc-budget, web-build]
    runs-on: ubuntu-latest
    # Serialisierung verhindert parallele Veröffentlichungen auf dieselbe Site.
    concurrency:
      group: hosting-${{ inputs.branch || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: web-release
          path: build/web
      - name: Aktuellen Branch-Stand prüfen
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.ref || github.sha }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')"
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Überholter Branch-Stand: Veröffentlichung übersprungen."
          fi
      - name: Geprüften Web-Build deployen
        if: steps.current.outputs.deploy == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HELDENSYNC_CCF0B }}
          projectId: heldensync-ccf0b
          # firebase-tools 15.34.1 prüft zusätzlich serviceusage.services.get und scheitert
          # mit 403; Pin, bis das geklärt ist.
          firebaseToolsVersion: 15.34.0
          channelId: live
          target: ${{ (inputs.branch || github.ref_name) == 'test' && 'test' || 'production' }}
      - name: Hosting-URL dokumentieren
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOYED_SHA: ${{ inputs.ref || github.sha }}
          SITE_URL: ${{ (inputs.branch || github.ref_name) == 'test' && 'https://heldensync-test.web.app' || 'https://heldensync-ccf0b.web.app' }}
        run: |
          echo "Web-Version ($DEPLOYED_SHA): $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
