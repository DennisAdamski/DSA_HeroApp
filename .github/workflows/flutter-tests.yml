name: Flutter CI

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main
      - test

  workflow_call:
    inputs:
      ref:
        description: Exakter Commit des automatisch synchronisierten Teststands
        required: true
        type: string
      branch:
        description: Zielbranch der wiederverwendeten CI
        required: true
        type: string
    secrets:
      FIREBASE_SERVICE_ACCOUNT_HELDENSYNC_CCF0B:
        required: true

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || inputs.branch || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Statische Analyse & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Abhaengigkeiten installieren
        run: flutter pub get

      - name: Formatierung pruefen
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Statische Analyse ausfuehren
        run: flutter analyze

  test:
    name: Unit- & Widget-Tests
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Abhaengigkeiten installieren
        run: flutter pub get

      - name: Tests ausfuehren
        run: flutter test

  loc-budget:
    name: LOC-Budget-Pruefung (Screens ≤ 700 Zeilen)
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Main-Test-Sync testen
        run: python tool/test_main_test_sync.py

      - name: LOC-Budget pruefen
        run: python tool/check_screen_loc_budget.py --max-lines 700

  web-build:
    name: Web-Release-Build
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - name: Build verifizieren
        run: |
          test -f build/web/assets/AssetManifest.bin.json
          test -n "$(ls -A build/web/assets/assets/heroes 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Firebase Hosting veröffentlichen
    if: github.event_name == 'push' && (inputs.branch == '' || inputs.branch == 'test')
    needs: [analyze, test, loc-budget, web-build]
    runs-on: ubuntu-latest
    # Serialisierung verhindert parallele Veröffentlichungen auf dieselbe Site.
    concurrency:
      group: hosting-${{ inputs.branch || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: web-release
          path: build/web
      - name: Aktuellen Branch-Stand prüfen
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.ref || github.sha }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')"
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Überholter Branch-Stand: Veröffentlichung übersprungen."
          fi
      - name: Geprüften Web-Build deployen
        if: steps.current.outputs.deploy == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HELDENSYNC_CCF0B }}
          projectId: heldensync-ccf0b
          channelId: live
          target: ${{ (inputs.branch || github.ref_name) == 'test' && 'test' || 'production' }}
      - name: Hosting-URL dokumentieren
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOYED_SHA: ${{ inputs.ref || github.sha }}
          SITE_URL: ${{ (inputs.branch || github.ref_name) == 'test' && 'https://heldensync-test.web.app' || 'https://heldensync-ccf0b.web.app' }}
        run: |
          echo "Web-Version ($DEPLOYED_SHA): $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
